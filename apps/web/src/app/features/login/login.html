<div class="login-wrap">
  <form class="login-card stl-card" (submit)="onSubmit(); $event.preventDefault()">
    <div class="brand">
      <span class="brand-mark">STV</span>
      <h1>Stalksville</h1>
    </div>
    <p class="tagline">Wolvesville intelligence workbench</p>

    <label class="field">
      Username
      <input class="stl-input" type="text" autocomplete="username" [formField]="loginForm.username" />
      @if (loginForm.username().touched() && loginForm.username().errors().length) {
        <span class="error">{{ loginForm.username().errors()[0].message }}</span>
      }
    </label>

    <label class="field">
      Password
      <input class="stl-input" type="password" autocomplete="current-password" [formField]="loginForm.password" />
      @if (loginForm.password().touched() && loginForm.password().errors().length) {
        <span class="error">{{ loginForm.password().errors()[0].message }}</span>
      }
    </label>

    @if (failing()) {
      <div class="stl-tag stl-tag--danger">Invalid username or password</div>
    }

    <button class="stl-button stl-button--primary" type="submit" [disabled]="loginForm().invalid() || submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
