# SPA hosting with a same-origin proxy to the API service (no CORS needed).
# The upstream goes through a variable + Docker's embedded DNS so api-container restarts
# (new IP) re-resolve instead of serving 502s until the web container restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
