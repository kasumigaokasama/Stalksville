name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + unit + integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        # TestDatabase expects stalksville/stalksville on localhost:5432 with a 'postgres' db.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stalksville
          POSTGRES_PASSWORD: stalksville
          POSTGRES_DB: stalksville
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stalksville"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        working-directory: apps/api
        run: dotnet build -c Release

      - name: Unit tests
        working-directory: apps/api
        run: dotnet test Stalksville.UnitTests -c Release --no-build

      - name: Integration tests
        working-directory: apps/api
        run: dotnet test Stalksville.IntegrationTests -c Release --no-build

  frontend:
    name: Frontend (build + unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Unit tests (vitest exits after run in non-TTY)
        run: npx ng test

  e2e:
    name: E2E (Playwright, mock Wolvesville)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: stalksville
          POSTGRES_PASSWORD: stalksville
          POSTGRES_DB: stalksville
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stalksville"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Redis keeps the e2e stack on the shared-cache path (RedisCacheProvider contract).
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build API (Playwright runs the DLL directly)
        working-directory: apps/api
        run: dotnet build Stalksville.Api -c Debug

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E
        run: npx playwright test
        env:
          CI: "true"
          # Exercises the shared Redis cache path; locally this stays unset (memory cache).
          CONNECTIONSTRINGS__REDIS: localhost:6379

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
